# swing — example configuration
# ---------------------------------------------------------------------------
# Copy this file to ./config.toml (or ~/.swing/config.toml) and edit it.
# config.toml is gitignored; this example file never contains real secrets.
#
#   cp config.example.toml config.toml
#
# Every value below is the built-in default, so a key you delete keeps working.
# Values are validated on load: anything out of range is reported as a plain
# sentence telling you which setting to fix.
# ---------------------------------------------------------------------------


[account]
# What the system thinks you are trading with. Position sizing is derived
# entirely from these three numbers, so get them right before going live.
equity = 100.0          # account size in dollars
risk_pct = 2.5          # percent of equity risked per trade (must be >0 and <=10)
max_positions = 4       # how many positions may be open at once
max_position_pct = 25.0 # percent of equity allowed in any single position

# NOTE on a $100 account: a 2.5% risk budget is $2.50. With a stop two ATRs
# below entry, almost every S&P name sizes to zero whole shares, so picks will
# be reported as "watch" rather than "buy". That is the system being honest,
# not broken.


[universe]
# Which lists of symbols to scan. Snapshots are committed with the package;
# they are not fetched at runtime, so scans work offline and backtests are
# reproducible.
sp500 = true
sp400 = true
sp600 = true
etfs = true             # ~40 liquid index/sector/industry/commodity ETFs
extra_symbols = []      # e.g. ["BRK-B", "GLD"] — Yahoo style, dashes not dots


[data]
# Where price history comes from. yfinance is the default so nothing waits on
# Schwab API approval. Bars are cached as parquet and fetched incrementally.
provider = "yfinance"   # "yfinance" | "schwab"
cache_dir = "~/.swing/cache"
start_date = 2010-01-01 # how far back to pull history (bare TOML date)

# Network manners. Raise retries / retry_backoff and lower download_batch if
# your provider starts rate-limiting you; none of these change what is
# computed, only how patiently it is fetched.
retries = 3             # attempts per download, including the first (1..10)
retry_backoff = 0.5     # seconds before the first retry, doubling each time (>0, <=10)
download_batch = 200    # symbols per batched download (10..500)


[strategy]
# The rule set. These are research knobs — change one, re-run the backtest,
# and let the gate decide whether the change earned its keep.

# --- liquidity floor -------------------------------------------------------
min_price = 5.0                 # skip anything cheaper (penny-stock noise)
min_dollar_volume = 5000000.0   # average daily dollar volume floor

# Lookback windows are capped against the history swing actually fetches (600
# calendar days, ~413 bars): sma_slow + sma_slow_rising_days, donchian_window,
# volume_avg_window and atr_window may each ask for at most 380 bars, and
# mom_skip_days + 126 at most 250. Past those a window never fills and every
# scan comes back empty, which looks exactly like a quiet market.

# --- trend template (Minervini-style stage-2 filter) -----------------------
sma_fast = 50
sma_mid = 150
sma_slow = 200
sma_slow_rising_days = 21       # the 200-day SMA must be higher than N days ago
min_above_low_mult = 1.25       # price >= 1.25x the 52-week low
max_below_high_pct = 25.0       # price within 25% of the 52-week high
adx_min = 20.0                  # minimum ADX(14): is there actually a trend?
                                # 0 disables the ADX filter (ADX >= 0 always holds)

# --- entry trigger ---------------------------------------------------------
donchian_window = 20            # breakout of the prior N-day high
breakout_proximity_pct = 2.0    # "close enough" band below that high, 0..25.
                                # 0 demands a strict new high; much above 2-3
                                # and the breakout stops discriminating, which
                                # is why the range stops at 25
volume_mult = 1.3               # breakout volume vs its average
volume_avg_window = 50

# --- exits -----------------------------------------------------------------
atr_window = 14
atr_stop_mult = 2.0             # initial stop = close - 2 x ATR
chandelier_mult = 3.0           # trailing stop = highest close - 3 x ATR
time_stop_days = 40             # give up on a trade that goes nowhere
earnings_blackout_days = 10     # no new entries this close to an earnings date

# --- ranking ---------------------------------------------------------------
mom_weight_126 = 0.6            # 6-month momentum weight
mom_weight_63 = 0.4             # 3-month momentum weight
mom_skip_days = 5               # skip the most recent week (short-term reversal)

# --- optional -------------------------------------------------------------
rsi2_enabled = false            # add a short-term pullback filter
fundamentals_filter = true      # require earnings/revenue growth for stocks


[regime]
# Market filter. New entries only while the market itself is in an uptrend;
# exits are never blocked by this.
enabled = true
symbol = "SPY"
sma_window = 200


[backtest]
start = 2010-01-01              # must be before `end`, or before today when
                                # `end` is omitted — otherwise the window is empty
# end = 2026-01-01              # omit to run through the latest available bar
slippage_bps = 5.0              # slippage per side, in basis points
spread_atr_frac = 0.05          # assumed half-spread as a fraction of ATR
is_years = 3                    # in-sample years per walk-forward fold
oos_years = 1                   # out-of-sample years per fold

# Reference capital the backtest trades with. This is deliberately NOT your
# [account] equity, and the two are used for different jobs:
#
#   backtest.initial_equity  measures the STRATEGY. A fixed reference capital
#                            keeps runs comparable to each other, and keeps
#                            whole-share rounding from degenerating the result
#                            — at a $100 account size almost every entry sizes
#                            to zero shares, so the backtest would produce
#                            roughly no fills and prove nothing either way.
#   account.equity           sizes the REAL picks that `swing scan` gives you.
#                            At a small balance most picks will land in the
#                            watch list rather than the buy list. That is the
#                            correct answer, not a bug: the trade exists, you
#                            just cannot take it at a sane risk per trade yet.
#
# Changing this does not make the strategy better or worse; it changes the
# capital base the reported CAGR and drawdown are measured against.
initial_equity = 10000.0        # must be at least 100

# The candidate values each walk-forward fold may choose between, one list per
# parameter. Leave this out — the default — and every fold searches exactly the
# grid below, which is what every existing report used. The default form, as a
# single line:
#
# tuning_grid = { atr_stop_mult = [1.5, 2.0, 2.5], chandelier_mult = [2.5, 3.0, 3.5], donchian_window = [15, 20, 25], volume_mult = [1.0, 1.3, 1.6] }
#
# The same thing as a section, which is easier to edit. Uncomment to use it,
# and note that setting `atr_stop_mult` etc. under [strategy] does NOT affect a
# walk-forward run: the tuner overwrites those four per fold, so this table is
# the only way to change what it may pick.
#
# [backtest.tuning_grid]
# atr_stop_mult   = [1.5, 2.0, 2.5]     # initial stop distance in ATRs
# chandelier_mult = [2.5, 3.0, 3.5]     # trailing stop distance in ATRs
# donchian_window = [15, 20, 25]        # breakout lookback in bars (>= 2)
# volume_mult     = [1.0, 1.3, 1.6]     # breakout volume vs its average
#
# Rules: only those four parameters may be tuned; each list must be non-empty
# with no repeats; each value must satisfy the same limits [strategy] puts on
# it; and the lists must multiply out to at most 512 combinations, because
# every combination is simulated over every symbol in every fold. Naming only
# some of the four is allowed — the rest simply are not tuned and keep their
# [strategy] value.
#
# Read a widened grid's result with MORE scepticism, not less: more candidates
# means more in-sample choices per fold, which is more opportunity to fit noise.
# The grid actually used is recorded in summary.json, and a non-default grid
# changes `config_hash` so its reports are never confused with the standard run.


[gates]
# The bar the OUT-OF-SAMPLE backtest must clear before `swing scan` will emit
# a single pick. Loosening these is how you lie to yourself.
min_profit_factor = 1.3
max_drawdown_pct = 35.0
min_trades = 30


[alerts]
# Leave a channel blank to switch it off. `swing notify-test` exercises
# whatever is configured here.
ntfy_topic = ""                 # e.g. "swing-picks-7f3a" at https://ntfy.sh
smtp_host = ""                  # e.g. "smtp.gmail.com"
smtp_port = 587
smtp_user = ""
smtp_password = ""              # use an app password, never your login password
email_to = ""
sms_gateway_address = ""        # e.g. "5551234567@vtext.com" (carrier gateway)
macos_notify = true             # local macOS notification banner


[schwab]
# Credentials from developer.schwab.com. NEVER put real values in this example
# file — put them in config.toml, which is gitignored.
api_key = ""
app_secret = ""
callback_url = "https://127.0.0.1:8182"
token_path = "~/.swing/schwab_token.json"
account_index = 0               # which linked account, counting from 0


[execution]
# Auto-execution. Everything is off by default and `--live` is additionally
# required on the command line, so two independent switches must be thrown.
enabled = false
autopilot = false               # skip the per-order confirmation prompt
max_orders_per_day = 3
max_new_exposure_pct = 50.0     # percent of equity newly committed in one day
max_quote_drift_atr = 1.0       # refuse if price moved this far since the scan
max_quote_drift_pct = 3.0


[schedule]
# launchd timers written by `swing schedule install`.
scan_time = "17:30"             # after the close
confirm_time = "09:00"          # before the open
timezone = "America/New_York"


[paths]
# A relative reports_dir is resolved against the directory THIS FILE lives in,
# so scan and confirm agree no matter which directory you run them from. Use an
# absolute path (or "~/.swing/reports") if you would rather pin it.
reports_dir = "reports"
state_dir = "~/.swing"
