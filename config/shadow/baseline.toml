# SHADOW TRACKED CONFIGURATION — "baseline"
# ---------------------------------------------------------------------------
# The shipping ./config.toml, as of 2026-08-22. This is the control arm: what
# the system does today, recorded forward day by day so that any future claim
# that some other configuration is better has something honest to be measured
# against.
#
# WHAT THIS FILE MAY CONTAIN
#   [account] [universe] [strategy] [regime] [backtest] [gates] — the RULES.
#
# WHAT IT MUST NOT CONTAIN
#   [schwab] [alerts] [execution] — these hold credentials, and unlike
#   config.toml this file is COMMITTED TO GIT. `swing shadow` refuses to load a
#   tracked file that sets them, and takes them from your real config.toml
#   instead. The same goes for [data] and [paths]: every tracked configuration
#   shares one cache and one state directory, so no committed file can redirect
#   where this machine reads or writes.
#
# ONE MORE OVERRIDE, APPLIED IN CODE
#   account.equity is replaced by backtest.initial_equity before scanning, for
#   the same reason the backtest does it: on a real $100 account whole-share
#   rounding rejects almost every entry, and a forward record of zero-share
#   decisions would compare nothing to nothing. See src/swing/shadow.py.
#
# Editing this file changes what is being measured. If you want to try
# something new, ADD A FILE — do not edit an arm that already has history, or
# the record stops meaning one thing.
# ---------------------------------------------------------------------------


[account]
equity = 100.0
risk_pct = 2.5
max_positions = 4
max_position_pct = 25.0


[universe]
sp500 = true
sp400 = true
sp600 = true
etfs = true
extra_symbols = []


[strategy]
# --- liquidity floor -------------------------------------------------------
min_price = 5.0
min_dollar_volume = 5000000.0

# --- trend template --------------------------------------------------------
sma_fast = 50
sma_mid = 150
sma_slow = 200
sma_slow_rising_days = 21
min_above_low_mult = 1.25
max_below_high_pct = 25.0
adx_min = 20.0

# --- entry trigger ---------------------------------------------------------
donchian_window = 20
breakout_proximity_pct = 2.0
volume_mult = 1.3
volume_avg_window = 50

# --- exits -----------------------------------------------------------------
atr_window = 14
atr_stop_mult = 2.0
chandelier_mult = 3.0
time_stop_days = 40
earnings_blackout_days = 10

# --- ranking ---------------------------------------------------------------
mom_weight_126 = 0.6
mom_weight_63 = 0.4
mom_skip_days = 5

# --- optional --------------------------------------------------------------
rsi2_enabled = false
fundamentals_filter = true


[regime]
enabled = true
symbol = "SPY"
sma_window = 200


[backtest]
start = 2010-01-01
slippage_bps = 5.0
spread_atr_frac = 0.05
is_years = 3
oos_years = 1
initial_equity = 10000.0


[gates]
min_profit_factor = 1.3
max_drawdown_pct = 35.0
min_trades = 30
