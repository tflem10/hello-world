[project]
name = "swing"
version = "0.1.0"
description = "Evidence-gated swing-trade pick system: nightly scans, walk-forward backtests, guarded execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "swing" }]
keywords = ["trading", "swing", "backtest", "momentum"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "typer>=0.12",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
  "requests>=2.31",
  "schwab-py>=1.3",
  "tenacity>=8.2",
]

[project.scripts]
swing = "swing.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing"]

[tool.hatch.build.targets.sdist]
include = ["src/swing", "tests", "config.example.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B008", # typer uses function calls (typer.Option/Argument) in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network_ok: allow real network access for this test (the autouse socket block is skipped)",
]
# Warning policy — deliberately scoped. Do not flatten this back to a bare
# `ignore::DeprecationWarning` for quiet; that blanket ignore is what made the
# suite lie to us once already.
#
# The incident: `swing/universe.py` imported `importlib.abc.Traversable`, an
# alias deprecated in Python 3.12 and REMOVED in 3.14. Python warned on every
# single import. The blanket ignore ate the warning, so a fully green suite was
# sitting on a hard ImportError that would land the day anyone upgraded the
# interpreter. It was found by accident, which is not a strategy.
#
# So the baseline stays permissive for other people's code — we cannot fix
# pandas, yfinance or schwab-py on their release schedule — and becomes fatal
# for ours. The fourth field is a regex matched against the `__name__` of the
# module the warning is *attributed* to, which is the caller rather than the
# callee: a deprecated stdlib call made from swing code is correctly blamed on
# swing, and a deprecated import in a swing module is blamed on that module.
#
# Order matters. pytest applies these in sequence and each one is prepended to
# `warnings.filters`, so the LAST matching entry wins. The `error` rules must
# stay below the `ignore` rules or they do nothing at all.
#
# tests/test_deprecations.py backstops this at import time and proves the guard
# still fires — see the docstring there before changing anything here.
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  'error::DeprecationWarning:swing($|\.)',
  'error::PendingDeprecationWarning:swing($|\.)',
]
