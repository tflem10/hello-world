[project]
name = "swing"
version = "0.1.0"
description = "Evidence-gated swing-trade pick system: nightly scans, walk-forward backtests, guarded execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "swing" }]
keywords = ["trading", "swing", "backtest", "momentum"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "typer>=0.12",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
  "requests>=2.31",
  "schwab-py>=1.3",
  "tenacity>=8.2",
]

[project.scripts]
swing = "swing.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing"]

[tool.hatch.build.targets.sdist]
include = ["src/swing", "tests", "config.example.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B008", # typer uses function calls (typer.Option/Argument) in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network_ok: allow real network access for this test (the autouse socket block is skipped)",
]
filterwarnings = ["ignore::DeprecationWarning"]
