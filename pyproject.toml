[project]
name = "swing"
version = "0.1.0"
description = "Evidence-based swing-trading pick system: research -> backtest -> gated daily picks -> drafted Schwab orders"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",     # metrics.py resamples with the "ME" alias, new in 2.2
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "requests>=2.31",
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
schwab = ["schwab-py>=1.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
swing = "swing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
